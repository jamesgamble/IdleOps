name: Feature request
description: Propose a change for product review.
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Objective
      description: Who would use this and what would it help them do?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable results that would demonstrate completion.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and dependencies
